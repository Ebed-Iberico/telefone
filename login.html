<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Denúncias Alo Trânsito</title>
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== VARIÁVEIS CSS ========== */
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #4338ca;
            --secondary: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        /* ========== RESET E ESTILOS GERAIS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== ESTILOS DO LOGIN ========== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: #0f172a;
        }

        .login-box {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 15px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .login-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            transition: var(--transition);
        }

        .login-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .show-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .login-button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remember-me input {
            width: auto;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            text-align: center;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.error {
            background-color: #fee;
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .message.success {
            background-color: #efffef;
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .message.warning {
            background-color: #fff8e6;
            color: var(--warning);
            border-left: 4px solid var(--warning);
        }

        .logo {
            width: 120px;
            height: auto;
            max-width: 100%;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .logo {
                width: 80px;
            }
            
            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- ========== TELA DE LOGIN ========== -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <div class="login-header">
                <img src="logo_alo_transito.png" alt="Alo Trânsito" class="logo">
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail ou usuário</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="email" class="login-input" placeholder="Digite seu e-mail ou usuário" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="login-input" placeholder="Digite sua senha" required>
                        <button type="button" class="show-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <a href="#" class="forgot-password" id="forgotPassword">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <span class="button-text">Entrar</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>

            <div style="text-align: center; margin-top: 25px;">
                <a href="cadastro_final.html" 
                   style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px;">
                    <i class="fas fa-user-plus"></i> Criar uma conta
                </a>
            </div>
            
            <div class="login-footer">
                <p>© <span id="currentYear"></span> Sistema de Denúncias - Alo Trânsito</p>
                <p style="font-size: 12px; margin-top: 5px;">v1.0.0</p>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const API_BASE_URL = 'https://denuncias-backend-0vax.onrender.com';
        const messageDiv = document.getElementById('message');
        
        // ==================== FUNÇÕES DE AUTENTICAÇÃO ====================
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function saveUserData(token, userData, rememberMe = false) {
            try {
                localStorage.setItem('auth_token', token);
                localStorage.setItem('user_data', JSON.stringify(userData));
                
                const expiresAt = new Date();
                expiresAt.setHours(expiresAt.getHours() + 24);
                localStorage.setItem('token_expires', expiresAt.toISOString());
                
                const emailInput = document.getElementById('email');
                if (rememberMe && emailInput && emailInput.value) {
                    localStorage.setItem('remember_me', 'true');
                    localStorage.setItem('saved_email', emailInput.value);
                } else {
                    localStorage.removeItem('remember_me');
                    localStorage.removeItem('saved_email');
                }
                
                console.log('✅ Dados do usuário salvos');
                return true;
            } catch (error) {
                console.error('Erro ao salvar dados:', error);
                return false;
            }
        }
        
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
        
        function setLoading(isLoading) {
            const loginButton = document.getElementById('loginButton');
            const buttonText = document.querySelector('.button-text');
            const spinner = document.getElementById('spinner');
            
            if (isLoading) {
                loginButton.disabled = true;
                if (buttonText) buttonText.style.opacity = '0.7';
                if (spinner) spinner.style.display = 'block';
            } else {
                loginButton.disabled = false;
                if (buttonText) buttonText.style.opacity = '1';
                if (spinner) spinner.style.display = 'none';
            }
        }
        
        // ==================== INICIALIZAÇÃO ====================
        
        document.addEventListener('DOMContentLoaded', function() {
            // Atualizar ano atual
            const currentYearSpan = document.getElementById('currentYear');
            if (currentYearSpan) {
                currentYearSpan.textContent = new Date().getFullYear();
            }
            
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    const eyeIcon = togglePassword.querySelector('i');
                    if (eyeIcon) {
                        eyeIcon.classList.toggle('fa-eye');
                        eyeIcon.classList.toggle('fa-eye-slash');
                    }
                });
            }
            
           /* // Verificar se já está autenticado
            const token = localStorage.getItem('auth_token');
            const expiresAt = localStorage.getItem('token_expires');
            
            if (token && expiresAt) {
                const now = new Date();
                const expires = new Date(expiresAt);
                
                if (now < expires) {
                    // Redirecionar diretamente para o dashboard
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    // Token expirado, limpar
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('token_expires');
                    localStorage.removeItem('user_data');
                }
            }
            
            // Preencher email salvo
            const rememberMe = localStorage.getItem('remember_me');
            const savedEmail = localStorage.getItem('saved_email');
            const emailInput = document.getElementById('email');
            const rememberCheckbox = document.getElementById('remember');
            
            if (rememberMe === 'true' && savedEmail && emailInput && rememberCheckbox) {
                emailInput.value = savedEmail;
                rememberCheckbox.checked = true;
            } */
            
            // Formulário de login
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const remember = document.getElementById('remember').checked;
                    
                    // Validação
                    if (!email || !password) {
                        showMessage('Por favor, preencha todos os campos', 'error');
                        return;
                    }
                    
                    if (email.includes('@') && !isValidEmail(email)) {
                        showMessage('Por favor, insira um e-mail válido', 'error');
                        return;
                    }
                    
                    setLoading(true);
                    
                    try {
                        console.log('🔐 Enviando login para:', `${API_BASE_URL}/auth/login`);
                        
                        const response = await fetch(`${API_BASE_URL}/auth/login`, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ 
                                email: email, 
                                senha: password 
                            })
                        });
                        
                        console.log('📊 Status da resposta:', response.status);
                        
                        let data;
                        try {
                            data = await response.json();
                            console.log('✅ Resposta da API:', data);
                        } catch (parseError) {
                            console.error('❌ Erro ao parsear resposta:', parseError);
                            const text = await response.text();
                            console.log('📄 Resposta (texto):', text);
                            throw new Error('Resposta inválida do servidor');
                        }
                        
                        if (!response.ok) {
                            const errorMsg = data.message || data.error || 'E-mail ou senha incorretos';
                            throw new Error(errorMsg);
                        }
                        
                        // Extrair token e dados do usuário
                        let token, userData;
                        
                        if (data.token) {
                            token = data.token;
                            userData = data.user || data.usuario || {};
                        } else if (data.access_token) {
                            token = data.access_token;
                            userData = data.user || data.usuario || {};
                        } else if (data.data) {
                            token = data.data.token || data.data.access_token;
                            userData = data.data.user || data.data.usuario || {};
                        } else {
                            token = data.token || data.access_token;
                            userData = data.user || data.usuario || data;
                        }
                        
                        if (!token) {
                            throw new Error('Token de autenticação não recebido');
                        }
                        
                        // Completar dados do usuário se necessário
                        if (!userData.email) userData.email = email;
                        if (!userData.nome) userData.nome = email.split('@')[0];
                        
                        // Salvar dados
                        saveUserData(token, userData, remember);
                        
                        // Sucesso
                        showMessage('✅ Login realizado com sucesso!', 'success');
                        
                        // Redirecionar após 1 segundo
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                        
                    } catch (error) {
                        console.error('❌ Erro no login:', error);
                        
                        let errorMessage;
                        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                            errorMessage = '❌ Não foi possível conectar ao servidor. Verifique:';
                            errorMessage += '\n1. Se o servidor está rodando em ' + API_BASE_URL;
                            errorMessage += '\n2. Sua conexão com a rede';
                        } else {
                            errorMessage = `❌ ${error.message}`;
                        }
                        
                        showMessage(errorMessage, 'error');
                    } finally {
                        setLoading(false);
                    }
                });
            }
            
            // Esqueci a senha
            const forgotPassword = document.getElementById('forgotPassword');
            if (forgotPassword) {
                forgotPassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    showMessage('Um link para redefinir sua senha será enviado para o seu e-mail.', 'success');
                });
            }
        });
    </script>
</body>
</html>
